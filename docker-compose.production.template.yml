services:

  hias-backend:
    image: bhiv/hias-backend:IMG_TAG
    container_name: hias_backend
    restart: unless-stopped
    ports:
      - "8026:8000"
    env_file:
      - ./backend/.env
    volumes:
      - hias_data:/app/data
    networks:
      - hias_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  hias-frontend:
    image: bhiv/hias-frontend:IMG_TAG
    container_name: hias_frontend
    restart: unless-stopped
    ports:
      - "5183:5173"
    env_file:
      - ./frontend/.env
    networks:
      - hias_network
    depends_on:
      hias-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hias_network:
    driver: bridge

volumes:
  hias_data:
    driver: local
